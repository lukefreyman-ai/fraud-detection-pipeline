[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudpipe"
version = "0.1.0"
description = "Card-fraud detection pipeline: velocity features, imbalance strategies, LightGBM vs. logistic regression, cost-based thresholding, SHAP, Streamlit review app"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
